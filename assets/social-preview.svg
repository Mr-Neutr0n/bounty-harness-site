<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="MedSeek - enforced clinical drafting, cited lookups, de-identification first. Open source. Drafts only; a clinician reviews everything.">
  <!-- Social preview card 1280x640 (GitHub og:image size). Export to PNG before use:
       chromium, headless mode: screenshot=social-preview.png, window-size=1280,640, default background transparent, input social-preview.svg
       FD-DECISION: PNG export + upload is founder action (repo settings). -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF8F2"/>
      <stop offset="1" stop-color="#F3EEE4"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#paper)"/>
  <rect x="14" y="14" width="1252" height="612" rx="26" fill="#FFFFFF" stroke="#E3DDD3" stroke-width="2"/>

  <!-- Brand tile: rounded square with cross knockout (evenodd), from src/lib/brand-assets.ts -->
  <g transform="translate(84 96) scale(6.5)">
    <path fill-rule="evenodd" fill="#0F766E" d="M7 2.5h10A4.5 4.5 0 0 1 21.5 7v10a4.5 4.5 0 0 1-4.5 4.5H7A4.5 4.5 0 0 1 2.5 17V7A4.5 4.5 0 0 1 7 2.5ZM13.5 6v4.5H18v3h-4.5V18h-3v-4.5H6v-3h4.5V6Z"/>
  </g>

  <text x="230" y="188" font-family="system-ui, 'Segoe UI', Roboto, sans-serif" font-size="92" font-weight="700" fill="#1F2937">MedSeek</text>
  <text x="232" y="252" font-family="system-ui, 'Segoe UI', Roboto, sans-serif" font-size="34" fill="#52606D">Clinical drafting that enforces its own checklists.</text>

  <g font-family="system-ui, 'Segoe UI', Roboto, sans-serif" font-size="30" fill="#1F2937">
    <text x="90" y="360">&#9989; Discharge blocked until pending results have owners</text>
    <text x="90" y="420">&#9989; Safe Harbor de-ID assist &#8212; uncertainty surfaced, not hidden</text>
    <text x="90" y="480">&#9989; Every lookup cited with source and retrieval date &#8212; or silence</text>
  </g>

  <rect x="88" y="520" width="1104" height="58" rx="14" fill="#0F766E"/>
  <text x="116" y="558" font-family="system-ui, .Segoe UI., Roboto, sans-serif" font-size="24" font-weight="600" fill="#FFFFFF" textLength="1080" lengthAdjust="spacingAndGlyphs">github.com/Mr-Neutr0n/dsh-medseek &#183; Apache-2.0 &#183; drafts only: a clinician reviews everything</text>
</svg>
